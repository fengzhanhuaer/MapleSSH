name: MapleStore build and release

on:
  push:
    branches: [main]
    tags: ["maplestore-v*"]
    paths:
      - "MapleStore/**"
      - ".github/workflows/maplestore.yml"
  pull_request:
    paths:
      - "MapleStore/**"
      - ".github/workflows/maplestore.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maplestore-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and verify container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.x"
          cache-dependency-path: MapleStore/go.sum
      - name: Check formatting, tests and vet
        working-directory: MapleStore
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l cmd internal)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go test -race ./...
          go vet ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./MapleStore
          file: ./MapleStore/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: maplestore:ci
          cache-from: type=gha,scope=maplestore-verify
          cache-to: type=gha,mode=max,scope=maplestore-verify
      - name: Validate Compose configuration
        shell: bash
        env:
          MAPLESTORE_ADMIN_PASSWORD: ci-compose-validation-only
        run: |
          set -euo pipefail
          docker compose -f MapleStore/compose.yaml config --quiet
      - name: Verify container startup and persistence
        shell: bash
        run: |
          set -euo pipefail
          bash MapleStore/scripts/smoke-container.sh maplestore:ci

  publish:
    name: Publish multi-platform image
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/maplestore-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare image metadata
        id: metadata
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/maplestore"
          version=edge
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#maplestore-v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a stable tag such as maplestore-v1.0.0" >&2
              exit 1
            fi
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo 'tags<<MAPLESTORE_TAGS'
            echo "$image:$version"
            echo "$image:sha-${GITHUB_SHA:0:12}"
            if [[ "$version" != edge ]]; then echo "$image:latest"; fi
            echo MAPLESTORE_TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./MapleStore
          file: ./MapleStore/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.title=MapleStore
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=maplestore-publish
          cache-to: type=gha,mode=max,scope=maplestore-publish

  release:
    name: Publish NAS installation bundle
    needs: publish
    if: startsWith(github.ref, 'refs/tags/maplestore-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package installation files
        shell: bash
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/maplestore-release"
          mkdir -p "$destination/MapleStore"
          cp MapleStore/compose.yaml MapleStore/.env.example MapleStore/README.md "$destination/MapleStore/"
          IMAGE="$IMAGE" VERSION="$VERSION" DESTINATION="$destination" python3 - <<'PY'
          import os
          from pathlib import Path
          example = Path(os.environ["DESTINATION"]) / "MapleStore" / ".env.example"
          lines = example.read_text().splitlines()
          lines = [f'MAPLESTORE_IMAGE={os.environ["IMAGE"]}:{os.environ["VERSION"]}' if line.startswith("MAPLESTORE_IMAGE=") else line for line in lines]
          example.write_text("\n".join(lines) + "\n")
          PY
          cd "$destination"
          tar -czf "MapleStore-install-$VERSION.tar.gz" MapleStore
          sha256sum "MapleStore-install-$VERSION.tar.gz" > "MapleStore-install-$VERSION.tar.gz.sha256"
      - name: Create release and upload bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "MapleStore $VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/maplestore-release/MapleStore-install-$VERSION.tar.gz" \
            "$RUNNER_TEMP/maplestore-release/MapleStore-install-$VERSION.tar.gz.sha256" --clobber
