name: maplestore

services:
  maplestore:
    image: "ghcr.io/fengzhanhuaer/maplestore:latest"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MAPLESTORE_ADMIN_USERNAME: "admin"
      MAPLESTORE_ADMIN_PASSWORD: ""
      MAPLESTORE_SECURE_COOKIE: "false"
    volumes:
      - ./data:/data
      - ./config:/config
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
